# push のたびに、CSV から作り直してテストが通るかを見る（サイトの作り直しは Cloudflare Pages 側）。
name: check
on:
  push:
    paths: ["observatory/**", "config/**", "web/**", "tests/**", "data/raw/**"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m observatory ingest --rebuild
      - run: python -m observatory check
      - run: python -m observatory build
      - run: python -m observatory export
      - run: python -m unittest discover tests
      - name: サイトの中身を確かめる
        run: |
          test -s site/web/index.html
          grep -c '<script id="obsData"' site/web/index.html
